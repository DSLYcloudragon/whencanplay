{% if user.is_authenticated %}
<style>
#wcpmenu { position: relative; display: inline-block; }
#wcpmenu .menubtn {
  background: none; border: 0; padding: 0; cursor: pointer;
  color: #e6e9ef; font-size: 13px; font-family: inherit; line-height: 1.6;
}
#wcpmenu .menubtn:hover, #wcpmenu .menubtn.open { color: #4ea1ff; }
#wcpmenu .caret { font-size: 10px; opacity: .7; margin-left: 2px; }
#wcpmenu .dropdown {
  position: absolute; right: 0; top: 100%; margin-top: 10px;
  min-width: 200px; max-width: 280px;
  background: #1b2029; border: 1px solid #2b323d;
  border-radius: 10px; padding: 6px; z-index: 300;
  box-shadow: 0 16px 38px rgba(0, 0, 0, .6);
}
#wcpmenu .dropdown[hidden] { display: none; }
#wcpmenu .dlabel {
  display: block; font-size: 11.5px; color: #8b93a1;
  padding: 7px 10px 4px; letter-spacing: .5px;
}
#wcpmenu .ditem {
  display: block; width: 100%; text-align: left; box-sizing: border-box;
  padding: 8px 10px; border-radius: 7px;
  color: #e6e9ef; font-size: 13px; text-decoration: none;
  background: none; border: 0; cursor: pointer; font-family: inherit;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#wcpmenu .ditem:hover { background: rgba(255, 255, 255, .08); color: #4ea1ff; }
#wcpmenu .ditem.danger { color: #ff9b9b; }
#wcpmenu .ditem.danger:hover { color: #ff6b6b; }
#wcpmenu .dsep { height: 1px; background: #2b323d; margin: 5px 4px; }
#wcpmenu .dempty { display: block; padding: 7px 10px; color: #8b93a1; font-size: 12.5px; }
#wcpmenu form { margin: 0; }
</style>

<div id="wcpmenu">
  <button type="button" class="menubtn" id="wcpMenubtn">我的<span class="caret">▾</span></button>

  <div class="dropdown" id="wcpDropdown" hidden>
    <span class="dlabel">我的群</span>
    {% for g in nav_groups %}
      <a class="ditem" href="/g/{{ g.code }}/">{{ g.name }}</a>
    {% empty %}
      <span class="dempty">还没加入任何群</span>
    {% endfor %}

    <div class="dsep"></div>
    <a class="ditem" href="{% url 'my_schedule' %}">填我的时间</a>
    <a class="ditem" href="{% url 'my_games' %}">我的游戏</a>

    <div class="dsep"></div>
    <a class="ditem" href="{% url 'group_create' %}">建群</a>
    <a class="ditem" href="{% url 'group_join' %}">加入群</a>

    {% if user.is_staff %}
      <div class="dsep"></div>
      <a class="ditem" href="/admin/">后台管理</a>
    {% endif %}

    <div class="dsep"></div>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit" class="ditem danger">退出登录</button>
    </form>
  </div>
</div>

<script>
(function () {
  var menu = document.getElementById('wcpmenu');
  if (!menu) return;
  var btn = document.getElementById('wcpMenubtn');
  var dd = document.getElementById('wcpDropdown');

  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    dd.hidden = !dd.hidden;
    btn.classList.toggle('open', !dd.hidden);
  });

  document.addEventListener('click', function (e) {
    if (!menu.contains(e.target)) {
      dd.hidden = true;
      btn.classList.remove('open');
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      dd.hidden = true;
      btn.classList.remove('open');
    }
  });
})();
</script>

{% else %}
  <a href="{% url 'login' %}">登录</a>
  <a href="{% url 'register' %}">注册</a>
{% endif %}
