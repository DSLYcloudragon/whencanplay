<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>开黑协调工具</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #171b22;
      --line: #262c36;
      --text: #e6e9ef;
      --muted: #8b93a1;
      --accent: #4ea1ff;
      --ok: #3ddc97;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(1200px 600px at 50% -10%, #1b2432 0%, var(--bg) 60%);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      line-height: 1.6;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 36px 32px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 26px;
      letter-spacing: .5px;
    }
    .tagline {
      margin: 0 0 26px;
      color: var(--muted);
      font-size: 14px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: rgba(61, 220, 151, .08);
      border: 1px solid rgba(61, 220, 151, .25);
      border-radius: 9px;
      font-size: 13.5px;
      color: var(--ok);
    }
    .next {
      margin-top: 26px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      font-size: 13.5px;
      color: var(--muted);
    }
    .btn {
      display: inline-block;
      background: var(--accent);
      color: #06121f;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      padding: 11px 20px;
      border-radius: 9px;
    }
    .btn:hover { filter: brightness(1.1); }
    .authbar {
      margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line);
      display: flex; align-items: center; gap: 14px; font-size: 13px;
    }
    .authbar a { color: var(--accent); text-decoration: none; }
    .authbar a:hover { text-decoration: underline; }
    .authbar .who { color: var(--text); }
    .logoutform { margin: 0; display: inline; }
    .logoutbtn {
      background: none; border: 0; padding: 0; cursor: pointer;
      color: var(--muted); font-size: 13px; font-family: inherit;
    }
    .logoutbtn:hover { color: var(--accent); }
    .grouplist { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .gs {
      display: inline-block; padding: 6px 14px; border-radius: 8px;
      background: #0f1319; border: 1px solid var(--line);
      color: var(--text); text-decoration: none; font-size: 13px;
    }
    .gs:hover { border-color: var(--accent); color: var(--accent); }
    .hintx { color: var(--muted); font-size: 13px; }
    .acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
    .next b { color: var(--text); font-weight: 600; }
    .next ol { margin: 10px 0 0; padding-left: 20px; }
    .next li { margin: 4px 0; }
    code {
      background: #0c0f13;
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 1px 5px;
      font-size: 12.5px;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>开黑协调工具</h1>
    <p class="tagline">让「今晚开黑吗」这句话，30 秒内有答案。</p>

    <div class="status">
      <span>●</span>
      <span>登录之后，这里会直接变成你正在看的那个群</span>
    </div>

    <div class="next">
      <b>登录之后可以做什么</b>
      <ol>
        <li>建一个群，拿到链接和邀请码，发到 QQ 群里</li>
        <li>填一次自己的每周作息，对所有群都生效</li>
        <li>勾出自己拥有的游戏</li>
        <li>打开群页面，看哪个时段有几个人、能玩什么</li>
      </ol>
    </div>

    <div class="acts">
      <a class="btn" href="{% url 'login' %}">登录</a>
      <a class="btn" href="{% url 'register' %}">注册</a>
    </div>

    <div class="authbar">
      {% include "core/_nav.html" %}
    </div>
  </main>
</body>
</html>
