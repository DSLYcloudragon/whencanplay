{% extends "core/auth_base.html" %}

{% block title %}登录{% endblock %}

{% block content %}
  <h1>登录</h1>
  <p class="sub">还没有账号？<a href="{% url 'register' %}">注册一个</a></p>

  {% if form.non_field_errors %}
    <div class="alert">邮箱或密码不对，再试一次。</div>
  {% endif %}

  <form method="post" novalidate>
    {% csrf_token %}

    <div class="field">
      <label for="{{ form.username.id_for_label }}">邮箱</label>
      {{ form.username }}
    </div>

    <div class="field">
      <label for="{{ form.password.id_for_label }}">密码</label>
      {{ form.password }}
    </div>

    <input type="hidden" name="next" value="{{ next }}">

    <button type="submit">登录</button>
  </form>

  <p class="foot"><a href="/">← 回首页</a></p>
{% endblock %}
