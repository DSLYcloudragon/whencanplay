<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>账号 · WhenCanPlay</title>
  <style>
    :root {
      --bg: #0f1115; --card: #171b22; --line: #262c36;
      --text: #e6e9ef; --muted: #8b93a1; --accent: #4ea1ff; --ok: #3ddc97;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
      background: radial-gradient(1200px 600px at 50% -10%, #1b2432 0%, var(--bg) 60%);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      line-height: 1.6; font-size: 14px;
    }
    .card {
      width: 100%; max-width: 520px;
      background: var(--card); border: 1px solid var(--line);
      border-radius: 14px; padding: 30px 28px;
    }
    h1 { margin: 0 0 4px; font-size: 22px; }
    .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }

    .grouplist { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .gs {
      display: inline-block; padding: 9px 16px; border-radius: 9px;
      background: #0f1319; border: 1px solid var(--line);
      color: var(--text); text-decoration: none; font-size: 13.5px;
    }
    .gs:hover { border-color: var(--accent); color: var(--accent); }
    .hintx { color: var(--muted); font-size: 13px; }

    h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 26px 0 10px; letter-spacing: .5px; }
    .acts { display: flex; flex-wrap: wrap; gap: 10px; }
    .btn {
      display: inline-block; background: #0f1319; border: 1px solid var(--line);
      color: var(--text); text-decoration: none; font-size: 13.5px;
      padding: 9px 16px; border-radius: 9px;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #06121f; font-weight: 700; }

    .bar {
      margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line);
      display: flex; align-items: center; gap: 14px; font-size: 13px;
    }
    .bar a { color: var(--accent); text-decoration: none; }
    .bar .who { color: var(--text); }
    .logoutform { margin: 0; margin-left: auto; display: inline; }
    .logoutbtn {
      background: none; border: 0; padding: 0; cursor: pointer;
      color: var(--muted); font-size: 13px; font-family: inherit;
    }
    .logoutbtn:hover { color: var(--accent); }
  </style>
</head>
<body>
  <main class="card">
    <div style="display:flex; justify-content:flex-end; margin-bottom:10px">
      {% include "core/_nav.html" %}
    </div>

    <h1>账号</h1>
    <p class="sub">欢迎回来，{{ user.nickname|default:user.username }}。</p>

    <h2>我加入的群</h2>
    <div class="grouplist">
      {% for g in my_groups %}
        <a class="gs" href="/g/{{ g.code }}/">{{ g.name }} →</a>
      {% empty %}
        <span class="hintx">还没加入任何群。建一个，或者找群主要邀请码。</span>
      {% endfor %}
    </div>

    <h2>我的资料</h2>
    <div class="acts">
      <a class="btn primary" href="{% url 'my_schedule' %}">填我的时间</a>
      <a class="btn" href="{% url 'my_games' %}">我的游戏</a>
    </div>

    <h2>群</h2>
    <div class="acts">
      <a class="btn" href="{% url 'group_create' %}">建群</a>
      <a class="btn" href="{% url 'group_join' %}">加入群</a>
    </div>
  </main>
</body>
</html>
